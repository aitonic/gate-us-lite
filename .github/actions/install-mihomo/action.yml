name: Install pinned Mihomo
description: Download the pinned Mihomo release, verify its SHA-256 and install it at $MIHOMO_BIN.

runs:
  using: composite
  steps:
    - name: Download, verify and install Mihomo
      shell: bash
      env:
        MIHOMO_VERSION: v1.19.31
        MIHOMO_SHA256: d4304c546c3cddcb6fafd4b4fddb0ba1a95ffa36606fda56d75db2e59ad24114
      run: |
        set -euo pipefail

        asset="mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz"
        url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${asset}"

        curl --fail --location --silent --show-error \
          --retry 3 --retry-all-errors --retry-delay 2 \
          --connect-timeout 15 --max-time 120 \
          --output /tmp/mihomo.gz "$url"

        echo "${MIHOMO_SHA256}  /tmp/mihomo.gz" | sha256sum --check --strict
        gzip -dc /tmp/mihomo.gz > "$MIHOMO_BIN"
        chmod +x "$MIHOMO_BIN"
        "$MIHOMO_BIN" -v
