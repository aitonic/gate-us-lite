[general]
country = "US"
preferred_limit = 3
fallback_limit = 8
timeout_seconds = 20
max_candidates_for_intel = 30

# Full OVPN profile materialization is bounded so one slow secondary source cannot
# consume the entire scheduled Actions job.
publicvpnlist_materialize_limit = 40
secondary_source_materialize_limit = 40
profile_fetch_timeout_seconds = 8

# PublicVPNList exposes technically checked freshness. Only records checked within
# the previous 24 hours are considered for materialization.
publicvpnlist_fresh_within_seconds = 86400

# Complete IP intelligence (ipwho and ProxyCheck both answered) can be reused for one
# day. Anything less, such as a provider failure or a missing ProxyCheck key, is only
# cached briefly so a transient outage cannot keep a node unknown for 24 hours.
intel_cache_ttl_seconds = 86400
intel_error_cache_ttl_seconds = 900

# Intelligence calls are deliberately budgeted. With three providers configured,
# one slow provider must not consume the 8-minute budget of the publish job.
intel_request_timeout_seconds = 6
intel_request_retries = 0
intel_workers = 6

# By default ProxyCheck forgets a detection after a few days. Asking for a longer
# window (its documented maximum is 60 days) keeps recently flagged addresses flagged,
# even at low confidence. 0 falls back to ProxyCheck's own default window.
proxycheck_lookback_days = 30

# TCP reachability is a soft GitHub-runner signal, not an OpenVPN handshake.
tcp_probe_limit = 40
tcp_probe_timeout_seconds = 2.0

# Each candidate is dialed through a real OpenVPN tunnel in a local Mihomo process
# (binary from MIHOMO_BIN, default `mihomo` on PATH) and must fetch the Cloudflare
# trace through it. Only candidates that complete the handshake and report a public
# exit address survive; that exit address replaces the endpoint address for the IP
# intelligence lookups. More candidates are probed than are sent to intelligence so
# dead nodes cannot crowd out live ones.
tunnel_probe_limit = 60
tunnel_probe_timeout_seconds = 15

# The last successful snapshot of a source stands in for it when the source fails or
# comes back empty. The workflow runs every second day, so the stand-in has to outlive
# one missed run (4 days). Its nodes still have to pass the live tunnel probe.
source_cache_max_age_seconds = 345600

# Protect the last-good source cache from abnormally small but technically
# successful snapshots.
source_baseline_window = 12
source_low_watermark_ratio = 0.40
source_low_watermark_min_baseline = 4

[filters]
# Every node is a public relay, and ProxyCheck flagged every public relay in the sample
# taken so far as a VPN/proxy host, so "hosting", "known proxy/VPN" and the risk score
# cannot tell relays apart; they only lower a node's rank. The checks below do separate
# them and reject a node from Preferred and Fallback alike. The Tor, compromised-host and residential-proxy
# verdicts only come from ProxyCheck, so require_known_intel makes PROXYCHECK_API_KEY
# effectively mandatory: an exit address without a verdict counts as unknown, never as
# clean, and is not published.
require_known_intel = true
reject_tor = true
reject_compromised = true
reject_residential_proxy = true
reject_country_mismatch = true
reject_hosting = false
# ProxyCheck's "anonymous" detection covers known proxies and VPNs.
reject_proxy = false
# ProxyCheck risk score (0-100). Its base scores follow the detection type (proxy and
# compromised score 100), so any limit below 100 rejects every known relay.
max_proxycheck_risk = 100
max_ping_ms = 250
min_speed_mbps = 0.5
min_preferred_availability_24h = 0.25
# Two consecutive TCP probe failures remove a TCP endpoint from Preferred, but it
# can remain fallback.
max_preferred_tcp_fail_streak = 2

[sources]
vpngate = true
publicvpnlist = true
vpngate_scraper = true
